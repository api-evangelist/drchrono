name: drchrono Client Libraries
description: >-
  DrChrono ships NO first-party client SDK in any package registry. Every DrChrono client library
  published to npm, PyPI, RubyGems or Packagist is community-maintained, and the most recent of them
  was last released in 2023. The only first-party developer code DrChrono publishes is a Django
  sample application in its GitHub organisation. Recorded as an honest absence — no package below is
  marked official.

