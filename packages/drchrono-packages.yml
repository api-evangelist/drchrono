  url: https://github.com/drchrono
  public_repo_count: 47
  first_party_non_fork_count: 9
  note: >-
    The DrChrono GitHub organisation is almost entirely forks of third-party libraries (AFNetworking,
    django-oauth-toolkit, redoc, PyPDF2, graphene-django). api-example-django is the only
    DrChrono-authored repository that concerns the API. Every repository was last pushed on
    2025-02-11 in a single bulk operation.

findings:
  - >-
    Zero official SDKs. A developer integrating DrChrono writes an HTTP client by hand or adopts a
    community package whose newest release predates the current contract.
  - >-
    The freshest community client, npm drchrono 0.0.5 (2023-12-01), was generated from the OpenAPI
    before the 2024-11-01 duplicate-patient change and before /api/message_threads and
    /api/recurring_appointment_instances appeared in the live spec. It is provably behind the API it
    wraps.
  - >-
    drchrono/php-sdk on Packagist calls itself the "Official PHP SDK" and is not. No apis.yml SDKs
    pointer was emitted for this repository, because emitting one would credit DrChrono with a client
    library it does not publish.
