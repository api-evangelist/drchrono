notes:
- Every resource scope advertised is .read — consistent with the CapabilityStatement, which declares only read and
  search-type interactions. The FHIR surface is read-only.
- permission-v1 and permission-v2 are both advertised as SMART capabilities, so both the v1 (patient/Observation.read)
  and v2 (patient/Observation.rs) scope syntaxes may be accepted; only the v1 form appears in scopes_supported.
- Scope grants are provisioned at client registration by an EHR vendor admin, not by dynamic client registration.
