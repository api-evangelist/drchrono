asyncapi: 3.0.0
info:
  title: DrChrono EHR Webhooks
  version: v4
  description: AsyncAPI description of the DrChrono EHR webhook surface, generated faithfully from the webhook reference
    DrChrono publishes at https://app.drchrono.com/api-docs/. Every event name, header, body key, delivery rule
    and verification step below is taken from that document; nothing is invented. DrChrono does NOT publish an AsyncAPI
    of its own — payload schemas are documented only as "the same serializer as the DrChrono API", so message payloads
    here are typed as the REST object without field-level detail rather than guessed at.
  contact:
    name: DrChrono API Support
    email: api@drchrono.com
    url: https://app.drchrono.com/api-docs/
  externalDocs:
    description: DrChrono webhook documentation
    url: https://app.drchrono.com/api-docs/
defaultContentType: application/json
servers:
  subscriber:
    host: '{callbackHost}'
    protocol: https
    description: Subscriber-hosted HTTPS endpoint. DrChrono POSTs deliveries to a callback URL you register on your
      API application; there is no DrChrono-hosted broker, topic or stream.
    variables:
      callbackHost:
        description: Host of your registered callback URL.
channels:
  callback:
    address: '{callbackUrl}'
    title: Registered webhook callback URL
    description: The HTTPS callback URL registered against a DrChrono API application. All events for that application
      are delivered to this one URL as POST requests; the X-drchrono-event header discriminates.
    parameters:
      callbackUrl:
        description: Callback URL configured in the webhook section of a saved DrChrono API application.
    messages:
      APPOINTMENT_CREATE:
        $ref: '#/components/messages/APPOINTMENT_CREATE'
      APPOINTMENT_MODIFY:
        $ref: '#/components/messages/APPOINTMENT_MODIFY'
      APPOINTMENT_DELETE:
        $ref: '#/components/messages/APPOINTMENT_DELETE'
      CASH_PAYMENT_DELETE:
        $ref: '#/components/messages/CASH_PAYMENT_DELETE'
      CLINICAL_NOTE_LOCK:
        $ref: '#/components/messages/CLINICAL_NOTE_LOCK'
      CLINICAL_NOTE_UNLOCK:
        $ref: '#/components/messages/CLINICAL_NOTE_UNLOCK'
      LAB_ORDER_CREATE:
        $ref: '#/components/messages/LAB_ORDER_CREATE'
      LAB_ORDER_MODIFY:
        $ref: '#/components/messages/LAB_ORDER_MODIFY'
      LAB_ORDER_DELETE:
        $ref: '#/components/messages/LAB_ORDER_DELETE'
      LINE_ITEM_CREATE:
        $ref: '#/components/messages/LINE_ITEM_CREATE'
      LINE_ITEM_MODIFY:
        $ref: '#/components/messages/LINE_ITEM_MODIFY'
      LINE_ITEM_DELETE:
        $ref: '#/components/messages/LINE_ITEM_DELETE'
      LINE_ITEM_TRANSACTION_DELETE:
        $ref: '#/components/messages/LINE_ITEM_TRANSACTION_DELETE'
      PATIENT_CREATE:
        $ref: '#/components/messages/PATIENT_CREATE'
      PATIENT_MODIFY:
        $ref: '#/components/messages/PATIENT_MODIFY'
      PATIENT_ALLERGY_CREATE:
        $ref: '#/components/messages/PATIENT_ALLERGY_CREATE'
      PATIENT_ALLERGY_MODIFY:
        $ref: '#/components/messages/PATIENT_ALLERGY_MODIFY'
      PATIENT_FLAG_CREATE:
