components:
  messages:
    APPOINTMENT_CREATE:
      name: APPOINTMENT_CREATE
      title: Appointment Create
      summary: We will deliver a hook any time an appointment is created
      contentType: application/json
      headers:
        type: object
        properties:
          X-drchrono-event:
            type: string
            const: APPOINTMENT_CREATE
            description: Event that triggered this hook
          X-drchrono-signature:
            type: string
            description: Secret token associated with this webhook
          X-drchrono-delivery:
            type: string
            description: ID of this delivery
        required:
        - X-drchrono-event
        - X-drchrono-signature
        - X-drchrono-delivery
      payload:
        type: object
        properties:
          receiver:
            type: object
            description: JSON representation of the webhook registration
          object:
            type: object
            description: JSON representation of the Appointment related to the triggered event. Uses the same serializer
              as the /api/appointments REST endpoint.
        required:
        - receiver
        - object
      x-rest-object: Appointment
      x-rest-path: /api/appointments
    APPOINTMENT_MODIFY:
      name: APPOINTMENT_MODIFY
      title: Appointment Modify
