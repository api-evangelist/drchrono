x-delivery:
  transport: HTTP POST to a subscriber-registered callback URL
  ping: 'A PING delivery is sent with header X-drchrono-event: PING when the "Ping webhook" button is used.'
  success: Any 2xx response is treated as delivered. Anything else, including 302, is a failure.
  retries:
  - attempt: 1
    after: 1 hour after the initial event
  - attempt: 2
    after: 3 hours after the initial event
  - attempt: 3
    after: 7 hours after the initial event
  after_retries: Deliveries still failing after three retries must be redelivered by hand from the deliveries view.
  ordering: No ordering guarantee is published.
  response_capture: DrChrono records only the response status code; response headers and body are discarded.
x-verification:
  trigger: On webhook creation and any time the callback URL changes.
  mechanism: 'DrChrono sends a GET to the callback URL with a msg query parameter. The subscriber must reply 200
    with JSON {"secret_token": "<hex>"} where <hex> is HMAC-SHA256 of msg keyed by the webhook secret token.'
  algorithm: HMAC-SHA256, hex digest
x-security:
  shared_secret_header: X-drchrono-signature carries the webhook secret token; subscribers should verify it on every
    delivery.
  signature_note: The signature header carries the shared secret itself rather than an HMAC of the request body,
    so it authenticates the sender but does not attest to payload integrity. Subscribers handling PHI should terminate
    TLS themselves and treat the header as a bearer secret.
  secret_guidance: DrChrono recommends a high-entropy secret, e.g. ruby -rsecurerandom -e 'puts SecureRandom.hex(20)'
x-registration:
  requirement: An API application must exist on file (a Test Model application is sufficient).
  scope: One webhook per API application; events are selected per webhook.
  console: Webhook section of a saved API application in DrChrono account settings.
