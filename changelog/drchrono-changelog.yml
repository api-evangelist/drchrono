name: drchrono API Changelog
description: >-
  DrChrono maintains two dated change surfaces. The API-level changelog for v4 (Hunt Valley) lists
  dated additions and fixes to REST endpoints and fields; the product changelog on Headway lists
  platform, web and mobile releases. The API changelog is the one that describes contract change —
  and its most recent dated API entry is 2024-11-01, which is the single most useful signal in this
  file about how actively the contract itself is moving.

scheme: named major versions (v0 Stonehenge, v1 New York, v2 Mountain View, v3 Sunnyvale, v4 Hunt Valley)
current_version: v4 (Hunt Valley)
breaking_change_policy: >-
  Changes to the current version are additive only — new endpoints, new fields, new optional query
  parameters. Non-read-only new fields are optional. See lifecycle/drchrono-lifecycle.yml.

