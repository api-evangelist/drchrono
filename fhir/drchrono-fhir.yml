service_base_directory:
  format: FHIR Bundle of Endpoint + Organization resources
  entry_count: 210
  practice_count: 105
  note: >-
    Each participating practice gets its own FHIR service base of the form
    /fhir/drchrono/{practice_id}/r4. The public directory is the ONC-required service base URL
    publication, and it is machine-readable and unauthenticated.

