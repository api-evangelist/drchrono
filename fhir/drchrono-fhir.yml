name: drchrono SMART on FHIR R4 API
description: >-
  DrChrono runs a second, entirely separate machine-readable API surface alongside its OAuth 2.0 REST
  v4 API — a SMART on FHIR R4 server serving 27 US Core resource types, read-only, with a live
  CapabilityStatement, a SMART discovery document, an OpenID Connect discovery document, FHIR Bulk
  Data Export, and a public FHIR Endpoint directory listing 105 practice-specific service bases.
  This is the ONC §170.315(g)(10) standardized API surface for the DrChrono EHR.

ownership_note: >-
  The FHIR server is hosted on everhealthsoftware.com, not drchrono.com. This is DrChrono's parent
  brand: DrChrono has been a wholly-owned part of EverCommerce's EverHealth portfolio since 2021, its
  own API terms of service name "EverHealth Solutions Inc." as the contracting Company, and the
  CapabilityStatement served at this host identifies itself as software.name "DrChrono FHIR Server"
  with name "DrChrono FHIR Server Capability Statement". The DrChrono-published FHIR API
  documentation at drchrono-fhirpresentation.everhealthsoftware.com states these exact base URLs and
  asserts that "DrChrono owns the Materials".

