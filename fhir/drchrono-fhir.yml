bulk_data_export:
  supported: true
  operations:
    - name: patient-export
      request: GET [fhir base]/Patient/$export
      scope: all patients the client is authorized to see
    - name: export
      request: GET [fhir base]/Group/[id]/$export
      scope: a specified group of patients
  required_headers:
    Accept: application/fhir+json
    Prefer: respond-async
  kickoff_response: 202 Accepted with a Content-Location polling URL
  output_format: ndjson
  auth: >-
    client_credentials with a JWT client assertion
    (client_assertion_type urn:ietf:params:oauth:client-assertion-type:jwt-bearer) and scope system/*.read
  source: https://drchrono-fhirpresentation.everhealthsoftware.com/drchrono/498711/r4/Home/ApiDocumentation

uscdi:
  certification_criteria: ['§170.315(g)(7)', '§170.315(g)(9)', '§170.315(g)(10)']
  statement: >-
    DrChrono states that the SMART on FHIR API allows other health IT applications to make read-only
    data requests for patient health information that is part of the USCDI, and that available data
    is limited to what USCDI defines. C-CDA handling uses the latest cumulative C-CDA document per
    patient by EffectiveDateTime.
  source: https://drchrono-fhirpresentation.everhealthsoftware.com/drchrono/498711/r4/Home/ApiDocumentation

divergence_from_rest:
  - The FHIR surface is READ-ONLY; the REST v4 API supports create, update and delete.
  - Identifier spaces do not overlap — FHIR resource ids are opaque strings, REST ids are integers.
  - Separate authorization servers, separate scope vocabularies (SMART patient/user/system scopes vs DrChrono billing/clinical/patients scopes).
  - The FHIR surface carries Bulk Data Export; the REST API has no bulk export equivalent.
  - The REST API carries writes, webhooks, billing, tasks and scheduling that have no FHIR projection.
