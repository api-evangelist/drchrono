  path: /api/transactions
  summary: Retrieve or search insurance transactions associated with billing line items
  scopes:
  - billing:read
  - billing:write
  read_only: true
- tool: transactions_list_create
  method: POST
  path: /api/transactions_list
  summary: Create transactions list request.  Use the UUID returned in the response to retrieve the batch of records.
    Results returned in order of id or updated_at.
  scopes:
  - billing:read
  - billing:write
  read_only: false
- tool: transactions_list_list
  method: GET
  path: /api/transactions_list
  summary: Retrieve or search transactions in batches. Results returned in order of ID or updated_at.
  scopes:
  - billing:read
  - billing:write
  read_only: true
- tool: transactions_read
  method: GET
  path: /api/transactions/{id}
  summary: Retrieve an existing insurance transaction
  scopes:
  - billing:read
  - billing:write
  read_only: true
- tool: user_groups_list
  method: GET
  path: /api/user_groups
  summary: Retrieve or search user groups
  scopes: null
  read_only: true
- tool: user_groups_read
  method: GET
  path: /api/user_groups/{id}
  summary: Retrieve an existing user group
  scopes: null
  read_only: true
- tool: users_list
  method: GET
  path: /api/users
  summary: Retrieve or search users, `/api/users/current` can be used to identify logged in user, it will redirect
    to `/api/users/{current_user_id}`
  scopes: null
  read_only: true
- tool: users_read
  method: GET
  path: /api/users/{id}
  summary: Retrieve an existing user, `/api/users/current` can be used to identify logged in user, it will redirect
    to `/api/users/{current_user_id}`
  scopes: null
  read_only: true
