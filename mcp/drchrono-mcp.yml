  endpoint: null
  install: null
  package: null
  auth: oauth
  verified: searched
  note: 'mode: none because no first-party MCP server exists in either shape — no hosted https endpoint an agent
    can POST to, and no vendor-published stdio package a human can install. auth records what a server WOULD need:
