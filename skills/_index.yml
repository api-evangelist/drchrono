shared_rules:
  - Access tokens live 48 hours; refresh with the refresh_token grant against https://app.drchrono.com/o/token/.
  - Every REST endpoint is gated on BOTH an OAuth scope and an in-app permission. A 403 on a correctly scoped token means the permission is missing and retrying will not help.
  - 500 requests per hour per API application, reset at the top of the hour, plus a 10 requests/second burst throttle. No rate-limit response headers exist.
  - There is no idempotency key. Never blind-retry a POST.
  - Some endpoints answer 302; the original method and headers must be replayed against Location.
  - The decimal type is a string truncated to two places on output.
  - The REST v4 API and the SMART on FHIR R4 API are separate contracts with separate authorization servers and non-overlapping identifier spaces.

