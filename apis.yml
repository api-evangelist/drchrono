name: drchrono
description: >-
  drchrono, part of EverCommerce's EverHealth portfolio, is an all-in-one EHR, practice management
  and medical billing platform for independent US medical practices. It publishes two distinct
  machine-readable API surfaces. The proprietary REST v4 API (codename Hunt Valley) is an OAuth
  2.0-secured contract of 170 paths and 329 operations covering patients, scheduling, clinical
  documentation, e-prescribing, labs, tasks, messaging and the full revenue cycle, published as a
  live OpenAPI 3.0 at https://app.drchrono.com/openapi-schema and complemented by a 27-event webhook
  surface. Alongside it drchrono runs a read-only, ONC-certified SMART on FHIR R4 server exposing 27
  US Core resource types for USCDI interoperability, with SMART App Launch and OpenID Connect
  discovery, FHIR Bulk Data Export, and a public service base directory covering 105 practices. The
  two estates share no tokens, no scopes and no identifier space.
